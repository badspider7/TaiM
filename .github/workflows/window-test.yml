name: Window Test

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    runs-on: windows-latest

    env:
      ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install deps
        run: pnpm i --frozen-lockfile --ignore-scripts --registry=https://registry.npmjs.org

      - name: Install app deps
        run: |
          node node_modules/electron/install.js
          pnpm run rebuild

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Regression tests
        run: pnpm test
